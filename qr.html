<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Hati</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Montserrat", sans-serif; min-height: 100vh; color: #fbf1f5; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 16px;
    background: linear-gradient(180deg, #170b1f 0%, #3a1838 45%, #7a2f4a 80%, #c2575a 100%) fixed; }
  h1 { font-weight: 900; font-size: 1.5rem; }
  .row { display: flex; gap: 8px; width: 100%; max-width: 560px; flex-wrap: wrap; }
  label { font-size: .8rem; opacity: .8; width: 100%; }
  input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.25); color: #fff; font: inherit; }
  button { padding: 12px 20px; border-radius: 12px; border: 0; font: 700 1rem "Montserrat", sans-serif; color: #fff; cursor: pointer; background: linear-gradient(90deg, #ff5c93, #9b7bff); }
  canvas#out { width: min(92vw, 460px); height: auto; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .note { max-width: 560px; font-size: .88rem; line-height: 1.6; opacity: .8; text-align: center; }
</style>
</head>
<body>
  <h1>QR Code Hati 💗</h1>
  <div class="row">
    <label for="url">Link website (yang sudah online, harus https://…)</label>
    <input id="url" value="https://wazxrong06.github.io/NADIA/" placeholder="https://namamu.github.io/NADIA/">
  </div>
  <div class="row">
    <label for="judul">Tulisan di bawah hati</label>
    <input id="judul" value="Scan aku, Nadia 💗">
    <button id="make">Buat QR</button>
  </div>
  <canvas id="out" width="1200" height="1400"></canvas>
  <button id="dl">Download PNG</button>
  <p class="note">Tes dulu: scan pakai kamera HP sebelum dicetak. Cetak minimal 5×5 cm supaya mudah di-scan.</p>
  <div id="tmp" hidden></div>

<script>
  const $ = id => document.getElementById(id);
  const cv = $("out"), ctx = cv.getContext("2d");

  const rnd = i => { const x = Math.sin(i * 9301 + 49297) * 233280; return x - Math.floor(x); };

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    const url = $("url").value.trim() || "https://contoh.github.io/";
    $("tmp").innerHTML = "";
    const q = new QRCode($("tmp"), { text: url, correctLevel: QRCode.CorrectLevel.H })._oQRCode;
    const n = q.getModuleCount(), quiet = 3;

    const W = cv.width, H = cv.height, area = 1080, ox = (W - area) / 2, oy = 80;

    // garis hati yang halus (kurva hati parametrik), dipakai untuk menggambar & cek "di dalam hati"
    const k = area / 34, heart = new Path2D();
    for (let t = 0; t <= Math.PI * 2 + .01; t += .01) {
      const x = 16 * Math.sin(t) ** 3, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      const px = W / 2 + x * k, py = oy + (y + 12.5) * k;
      t === 0 ? heart.moveTo(px, py) : heart.lineTo(px, py);
    }
    const inside = (x, y) => ctx.isPointInPath(heart, x, y);

    // cari grid terkecil yang muat: QR + area kosong harus utuh di dalam hati
    let G, cell, x0, y0;
    search: for (G = n + 2 * quiet; ; G++) {
      cell = area / G; x0 = Math.floor((G - n) / 2);
      for (y0 = quiet; y0 < G - n - quiet; y0++) {
        const L = ox + (x0 - quiet) * cell, T = oy + (y0 - quiet) * cell, R = L + (n + 2 * quiet) * cell, B = T + (n + 2 * quiet) * cell;
        if (inside(L, T) && inside(R, T) && inside(L, B) && inside(R, B) && inside((L + R) / 2, T)) break search;
      }
    }

    // latar kartu
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#ffe3ec"); bg.addColorStop(1, "#ffc2d6");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // hati putih sebagai alas
    ctx.save();
    ctx.shadowColor = "rgba(180,20,80,.3)"; ctx.shadowBlur = 50; ctx.shadowOffsetY = 14;
    ctx.fillStyle = "#fff"; ctx.fill(heart);
    ctx.restore();
    ctx.lineWidth = 10; ctx.strokeStyle = "#ff8fb1"; ctx.stroke(heart);

    // titik hiasan pink muda di luar area QR (tidak mengganggu scan)
    const inQRZone = (i, j) => i >= x0 - quiet && i < x0 + n + quiet && j >= y0 - quiet && j < y0 + n + quiet;
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
      const cx = ox + (i + .5) * cell, cy = oy + (j + .5) * cell;
      if (inQRZone(i, j) || !inside(cx, cy) || !inside(cx - cell * .6, cy) || !inside(cx + cell * .6, cy) || !inside(cx, cy + cell * .6) || rnd(i * 131 + j) > .5) continue;
      ctx.fillStyle = rnd(i + j * 77) > .5 ? "#ffb3cc" : "#ffc9da";
      ctx.beginPath(); ctx.arc(cx, cy, cell * .42, 0, Math.PI * 2); ctx.fill();
    }

    // modul QR asli (warna gelap supaya kontras)
    ctx.fillStyle = "#9c0f45";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) {
      roundRect(ox + (x0 + c) * cell + cell * .03, oy + (y0 + r) * cell + cell * .03, cell * .94, cell * .94, cell * .15); ctx.fill();
    }

    // tulisan
    ctx.textAlign = "center"; ctx.fillStyle = "#c2185b";
    ctx.font = "84px Pacifico";
    ctx.fillText($("judul").value, W / 2, H - 120);
  }

  $("make").onclick = draw;
  $("url").addEventListener("keydown", e => { if (e.key === "Enter") draw(); });
  $("dl").onclick = () => {
    const a = document.createElement("a");
    a.download = "qr-hati.png"; a.href = cv.toDataURL("image/png"); a.click();
  };
  // qr.html?url=... langsung mengisi link
  const pre = new URLSearchParams(location.search).get("url");
  if (pre) $("url").value = pre;
  document.fonts.load("84px Pacifico").then(draw, draw);
</script>
</body>
</html>
