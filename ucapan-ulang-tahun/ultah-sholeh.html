<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday ⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script>
  /* ======================= GANTI DI SINI ======================= */
  const CONFIG = {
    nama: "Muhammad Sholeh Rahman",
    umur: 21,
    tanggalUltah: "12-06",               // BULAN-TANGGAL; halaman ini hanya bisa dibuka di tanggal ini
    pesan: "Semoga hidupmu selalu terhubung, arusnya lancar, tegangannya stabil, dan nggak pernah korsleting. Aamiin ⚡"
  };

  // Dibuka dari kartu Sholeh di pilih.html. Selain 6 Desember, langsung ke portofolio.
  // Untuk mencoba di hari lain, buka: ultah-sholeh.html?preview
  const PREVIEW = new URLSearchParams(location.search).has("preview");
  (function () {
    if (!authUser()) return;
    const [m, d] = CONFIG.tanggalUltah.split("-").map(Number), now = new Date();
    if (!(now.getMonth() + 1 === m && now.getDate() === d) && !PREVIEW) location.replace("sholeh.html");
  })();
</script>
<style>
  :root { --bg: #070616; --ink: #eef0ff; --muted: #9a9cc4; --volt: #ffd23f; --arc: #b07bff; --cyan: #4fe3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #1a1240 0%, #0b0922 55%, var(--bg) 100%); }

  /* papan sirkuit di latar */
  .pcb { position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background-image: linear-gradient(rgba(79,227,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(79,227,255,.05) 1px, transparent 1px);
    background-size: 36px 36px; }
  .pcb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pcb .trace { fill: none; stroke: rgba(79,227,255,.14); stroke-width: 2; }
  .pcb .pulse { fill: none; stroke: var(--cyan); stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--cyan));
    stroke-dasharray: 14 400; animation: run var(--t) linear infinite; animation-delay: var(--dl); }
  .pcb .pad { fill: #0b0922; stroke: rgba(79,227,255,.35); stroke-width: 2; }
  @keyframes run { from { stroke-dashoffset: 414 } to { stroke-dashoffset: 0 } }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .flash { position: fixed; inset: 0; background: #e9ddff; opacity: 0; pointer-events: none; z-index: 6; }
  .flash.go { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .9 } 15% { opacity: .1 } 25% { opacity: .7 } 100% { opacity: 0 } }

  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 20px 16px; transition: opacity .6s; z-index: 2; }
  .stage.hidden { opacity: 0; pointer-events: none; }
  .stage > * { max-width: 100%; }

  /* ---- Tahap 1: panel MCB 3D ---- */
  .scene { perspective: 900px; }
  .panel { position: relative; width: 210px; height: 280px; transform-style: preserve-3d; transform: rotateX(16deg) rotateY(-22deg);
    animation: hover 5s ease-in-out infinite alternate; }
  @keyframes hover { to { transform: rotateX(8deg) rotateY(18deg) translateY(-8px); } }
  .face { position: absolute; border-radius: 14px; }
  .front { inset: 0; transform: translateZ(22px); background: linear-gradient(160deg, #3a3f5c, #1d2036 70%); border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 30px 60px rgba(0,0,0,.55); display: flex; flex-direction: column; align-items: center; padding: 16px 14px; }
  .back { inset: 0; transform: translateZ(-22px); background: #111325; }
  .side { top: 6px; bottom: 6px; width: 44px; background: linear-gradient(90deg, #15172a, #2a2e47); }
  .side.l { left: -22px; transform: rotateY(-90deg); } .side.r { right: -22px; transform: rotateY(90deg); }
  .cap { left: 6px; right: 6px; height: 44px; background: linear-gradient(#2c3050, #171a2e); }
  .cap.t { top: -22px; transform: rotateX(90deg); } .cap.b { bottom: -22px; transform: rotateX(-90deg); }
  .warn { width: 100%; padding: 5px 0; border-radius: 6px; font: 900 .62rem "Orbitron", sans-serif; letter-spacing: 1px; color: #111;
    background: repeating-linear-gradient(-45deg, var(--volt) 0 10px, #1a1a1a 10px 20px); }
  .warn span { background: var(--volt); padding: 2px 6px; border-radius: 3px; }
  .mcb { margin-top: 16px; width: 92px; height: 150px; border-radius: 8px; background: linear-gradient(#f4f4f6, #c9cad3); position: relative;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), 0 8px 18px rgba(0,0,0,.4); cursor: pointer; }
  .mcb small { position: absolute; left: 0; right: 0; font: 700 .58rem "Orbitron", sans-serif; color: #444; }
  .mcb .on { top: 8px; } .mcb .off { bottom: 8px; }
  .slot { position: absolute; left: 26px; right: 26px; top: 28px; bottom: 28px; border-radius: 6px; background: #2b2d3a; box-shadow: inset 0 3px 8px rgba(0,0,0,.6); }
  .lever { position: absolute; left: 2px; right: 2px; height: 46%; bottom: 2px; border-radius: 5px; transition: bottom .25s cubic-bezier(.5,1.6,.5,1), background .25s;
    background: linear-gradient(#ff6b6b, #c22b3b); box-shadow: 0 4px 0 #7d1220, 0 6px 10px rgba(0,0,0,.5); }
  .mcb.up .lever { bottom: calc(54% - 2px); background: linear-gradient(#7dffb0, #1fbf63); box-shadow: 0 -4px 0 #0d7a3b, 0 -6px 10px rgba(0,0,0,.5); }
  .led { margin-top: 14px; width: 12px; height: 12px; border-radius: 50%; background: #ff3b4f; box-shadow: 0 0 12px #ff3b4f; }
  .led.on { background: #3dff8a; box-shadow: 0 0 14px #3dff8a; }
  .hint { margin-top: 40px; font-weight: 800; font-size: 1.15rem; }
  .hint small { display: block; color: var(--muted); font-weight: 400; font-size: .85rem; margin-top: 6px; }
  .hint b { color: var(--volt); }

  /* ---- Tahap 2: bola plasma + ucapan ---- */
  .s2 { overflow-y: auto; justify-content: flex-start; padding-top: max(24px, 4vh); }
  .ball { position: relative; width: min(64vw, 300px); flex-shrink: 0; }
  .ball canvas { width: 100%; aspect-ratio: 1; display: block; cursor: crosshair; touch-action: none; }
  .base { width: 46%; height: 34px; margin: -14px auto 0; border-radius: 6px 6px 14px 14px; position: relative;
    background: linear-gradient(90deg, #0d0f1d, #3a3e5e 45%, #151829); box-shadow: 0 14px 30px rgba(0,0,0,.6); }
  .base::after { content: ""; position: absolute; left: 50%; top: 10px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #3dff8a; box-shadow: 0 0 10px #3dff8a; }
  .tip { font-size: .75rem; color: var(--muted); margin-top: 10px; }
  .a { opacity: 0; transform: translateY(24px); transition: opacity .8s, transform .8s; transition-delay: var(--d); }
  .show .a { opacity: 1; transform: none; }
  .neon { margin-top: 18px; font: 900 clamp(1.4rem, 6.6vw, 3rem) "Orbitron", sans-serif; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 16px var(--arc), 0 0 34px var(--arc), 0 0 60px #7a3dff; animation: flicker 4s infinite; }
  @keyframes flicker { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1 } 20%, 63% { opacity: .35 } }
  .nm { margin-top: 6px; font-weight: 800; font-size: clamp(1.05rem, 4.5vw, 1.45rem);
    background: linear-gradient(90deg, var(--cyan), var(--arc), var(--volt)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .meter { margin: 18px auto 0; display: inline-flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 14px;
    background: linear-gradient(#262a1c, #14160e); border: 2px solid #3d4128; box-shadow: inset 0 0 18px rgba(0,0,0,.7), 0 10px 30px rgba(0,0,0,.4); }
  .meter .lbl { font: 700 .62rem "Orbitron", sans-serif; color: #8f9a5a; text-align: left; line-height: 1.5; }
  .meter b { font: 900 2.4rem "Orbitron", sans-serif; color: #c8ff4f; text-shadow: 0 0 10px rgba(200,255,79,.6); min-width: 2.2ch; font-variant-numeric: tabular-nums; }
  .msg { max-width: 460px; margin-top: 16px; color: #cfd2f2; line-height: 1.6; font-size: .95rem; }
  .btn { margin: 22px 0 30px; padding: 13px 28px; border-radius: 999px; border: 0; cursor: pointer; font: 800 1rem "Plus Jakarta Sans", sans-serif; color: #120a2a;
    background: linear-gradient(90deg, var(--volt), #ffe98a); box-shadow: 0 0 0 0 rgba(255,210,63,.6); animation: ring 1.8s infinite; }
  @keyframes ring { 70% { box-shadow: 0 0 0 16px rgba(255,210,63,0) } 100% { box-shadow: 0 0 0 0 rgba(255,210,63,0) } }
  @media (prefers-reduced-motion: reduce) { .panel, .neon, .btn, .pcb .pulse { animation: none; } }
</style>
</head>
<body>
<div class="pcb" id="pcb"></div>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>

<section class="stage" id="st1">
  <div class="scene">
    <div class="panel">
      <div class="face back"></div>
      <div class="face side l"></div><div class="face side r"></div>
      <div class="face cap t"></div><div class="face cap b"></div>
      <div class="face front">
        <div class="warn"><span>⚡ AWAS TEGANGAN TINGGI ⚡</span></div>
        <div class="mcb" id="mcb" role="button" tabindex="0" aria-label="Nyalakan saklar">
          <small class="on">ON · I</small><div class="slot"><div class="lever"></div></div><small class="off">OFF · O</small>
        </div>
        <div class="led" id="led"></div>
      </div>
    </div>
  </div>
  <p class="hint">Ada yang ulang tahun hari ini… <b>nyalakan saklarnya ⚡</b><small>Ketuk MCB-nya ke posisi ON</small></p>
</section>

<section class="stage s2 hidden" id="st2">
  <div class="ball a" style="--d:.1s"><canvas id="plasma" width="600" height="600"></canvas><div class="base"></div></div>
  <p class="tip a" style="--d:.3s">Sentuh bolanya, petirnya ngikutin jarimu ⚡</p>
  <h1 class="neon a" style="--d:.5s">HAPPY BIRTHDAY</h1>
  <div class="nm a" style="--d:.8s" id="nama"></div>
  <div class="meter a" style="--d:1.1s"><div class="lbl">UMUR<br>DC · AUTO</div><b id="volt">00</b><div class="lbl">TAHUN<br>⚡ ON</div></div>
  <p class="msg a" style="--d:1.4s" id="pesan"></p>
  <button class="btn a" style="--d:1.7s" id="masuk">Masuk ke portofolio ⚡</button>
</section>

<script>
  const $ = id => document.getElementById(id);
  $("nama").textContent = CONFIG.nama;
  $("pesan").textContent = CONFIG.pesan;
  // replace = tombol Back tidak kembali ke sini
  $("masuk").onclick = () => location.replace("sholeh.html");

  // ---- Jalur sirkuit dengan pulsa arus ----
  (function pcb() {
    const W = innerWidth, H = innerHeight, NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    let s = "";
    for (let i = 0; i < 14; i++) {
      let x = Math.round(Math.random() * W / 36) * 36, y = Math.round(Math.random() * H / 36) * 36, d = `M${x} ${y}`;
      for (let k = 0; k < 4; k++) {
        if (k % 2) y += (Math.random() < .5 ? -1 : 1) * 36 * (2 + Math.floor(Math.random() * 5));
        else x += (Math.random() < .5 ? -1 : 1) * 36 * (2 + Math.floor(Math.random() * 6));
        d += ` L${x} ${y}`;
      }
      s += `<path class="trace" d="${d}"/><path class="pulse" d="${d}" style="--t:${2.5 + Math.random() * 3}s;--dl:${-Math.random() * 4}s"/><circle class="pad" cx="${x}" cy="${y}" r="5"/>`;
    }
    svg.innerHTML = s;
    $("pcb").appendChild(svg);
  })();

  // ---- Kilat (dipakai di latar & bola plasma) ----
  function jalurKilat(x1, y1, x2, y2, acak, langkah = 6) {
    let p = [[x1, y1], [x2, y2]];
    for (let k = 0; k < langkah; k++) {
      const q = [p[0]];
      for (let i = 1; i < p.length; i++) {
        const [ax, ay] = p[i - 1], [bx, by] = p[i], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, o = (Math.random() - .5) * acak;
        q.push([(ax + bx) / 2 - dy / L * o, (ay + by) / 2 + dx / L * o], p[i]);
      }
      p = q; acak *= .55;
    }
    return p;
  }
  function gambarKilat(ctx, pts, warna, tebal, alpha) {
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = warna; ctx.lineWidth = tebal; ctx.shadowColor = warna; ctx.shadowBlur = tebal * 6; ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(1, tebal / 3); ctx.shadowBlur = 0; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- Lapisan efek: kilat latar + percikan ----
  const fx = $("fx"), fc = fx.getContext("2d");
  let dpr = Math.min(devicePixelRatio || 1, 2);
  const ukur = () => { fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fc.setTransform(dpr, 0, 0, dpr, 0, 0); };
  ukur(); addEventListener("resize", ukur);
  const kilat = [], percik = [];
  function sambar(x1, y1, x2, y2) { kilat.push({ pts: jalurKilat(x1, y1, x2, y2, Math.hypot(x2 - x1, y2 - y1) * .35), t: 1 }); }
  function letik(x, y, n = 26) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6;
      percik.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, t: 1, c: Math.random() < .5 ? "#ffd23f" : "#4fe3ff" });
    }
  }
  function loopFx() {
    fc.clearRect(0, 0, innerWidth, innerHeight);
    fc.globalCompositeOperation = "lighter";
    for (let i = kilat.length - 1; i >= 0; i--) {
      const k = kilat[i];
      gambarKilat(fc, k.pts, "#b07bff", 3, k.t);
      if ((k.t -= .06) <= 0) kilat.splice(i, 1);
    }
    for (let i = percik.length - 1; i >= 0; i--) {
      const p = percik[i];
      fc.strokeStyle = p.c; fc.globalAlpha = p.t; fc.lineWidth = 2;
      fc.beginPath(); fc.moveTo(p.x, p.y); p.x += p.vx; p.y += p.vy; p.vy += .25; fc.lineTo(p.x, p.y); fc.stroke();
      if ((p.t -= .025) <= 0) percik.splice(i, 1);
    }
    fc.globalAlpha = 1; fc.globalCompositeOperation = "source-over";
    requestAnimationFrame(loopFx);
  }
  loopFx();
  function petirAcak() {
    const x = Math.random() * innerWidth;
    sambar(x, -10, x + (Math.random() - .5) * 300, innerHeight * (.3 + Math.random() * .5));
    setTimeout(petirAcak, 1800 + Math.random() * 3500);
  }

  // suara "jzzt" pendek dari derau (tanpa file audio)
  function bunyiSetrum() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)(), len = ac.sampleRate * .45;
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .3 ? 1 : .2) * (1 - i / len);
      const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
      bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = .8; g.gain.value = .35;
      src.buffer = buf; src.connect(bp).connect(g).connect(ac.destination); src.start();
    } catch {}
  }

  // ---- Tahap 1 → 2: nyalakan MCB ----
  let nyala = false;
  function nyalakan() {
    if (nyala) return; nyala = true;
    $("mcb").classList.add("up"); $("led").classList.add("on");
    bunyiSetrum();
    const r = $("mcb").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    letik(cx, cy, 40);
    for (let i = 0; i < 5; i++) setTimeout(() => sambar(cx, cy, Math.random() * innerWidth, Math.random() < .5 ? -10 : innerHeight + 10), i * 90);
    setTimeout(() => { $("flash").classList.add("go"); }, 350);
    setTimeout(() => {
      $("st1").classList.add("hidden"); $("st2").classList.remove("hidden");
      requestAnimationFrame(() => $("st2").classList.add("show"));
      mulaiPlasma(); petirAcak(); hitungUmur();
    }, 800);
  }
  $("mcb").onclick = nyalakan;
  $("mcb").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nyalakan(); } };

  function hitungUmur() {
    let n = 0;
    setTimeout(function naik() {
      $("volt").textContent = String(n).padStart(2, "0");
      if (n++ < CONFIG.umur) setTimeout(naik, 45 + n * 4);
      else { const r = $("volt").getBoundingClientRect(); letik(r.left + r.width / 2, r.top + r.height / 2, 30); }
    }, 1300);
  }
  $("st2").addEventListener("click", e => { if (e.target.id !== "masuk") letik(e.clientX, e.clientY, 14); });

  // ---- Bola plasma 3D ----
  function mulaiPlasma() {
    const cv = $("plasma"), c = cv.getContext("2d"), S = cv.width, C = S / 2, R = S * .44;
    // ujung-ujung petir: vektor satuan 3D yang bergerak pelan di permukaan bola
    const ujung = Array.from({ length: 8 }, () => { const v = [Math.random() - .5, Math.random() - .5, Math.random() - .5]; return norm(v); });
    let jari = null, putar = 0;
    function norm(v) { const L = Math.hypot(...v) || 1; return v.map(x => x / L); }
    const proyeksi = ([x, y, z]) => { const k = 1 / (1 - z * .18); return [C + x * R * k, C + y * R * k, z]; };
    function posJari(e) {
      const r = cv.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width * S - C) / R, y = ((e.clientY - r.top) / r.height * S - C) / R;
      jari = x * x + y * y < 1 ? [x, y, Math.sqrt(1 - x * x - y * y)] : null;
    }
    cv.addEventListener("pointermove", posJari);
    cv.addEventListener("pointerdown", e => { posJari(e); bunyiSetrum(); });
    cv.addEventListener("pointerleave", () => jari = null);

    (function frame() {
      c.clearRect(0, 0, S, S);
      // kaca bola
      const g = c.createRadialGradient(C, C, R * .1, C, C, R);
      g.addColorStop(0, "rgba(120,60,220,.35)"); g.addColorStop(.7, "rgba(40,20,90,.35)"); g.addColorStop(1, "rgba(150,120,255,.55)");
      c.fillStyle = g; c.beginPath(); c.arc(C, C, R, 0, Math.PI * 2); c.fill();

      // kerangka bola yang berputar (garis lintang & bujur)
      putar += .006;
      const tilt = .35, rot = ([x, y, z]) => {
        const cx = Math.cos(putar), sx = Math.sin(putar), x1 = x * cx + z * sx, z1 = -x * sx + z * cx;
        const ct = Math.cos(tilt), st = Math.sin(tilt); return [x1, y * ct - z1 * st, y * st + z1 * ct];
      };
      c.lineWidth = 1.2;
      const garis = pts => { for (let i = 1; i < pts.length; i++) { const a = proyeksi(rot(pts[i - 1])), b = proyeksi(rot(pts[i]));
        c.strokeStyle = `rgba(160,200,255,${.06 + .16 * (a[2] + 1) / 2})`; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); } };
      for (let lat = -60; lat <= 60; lat += 30) {
        const p = [], la = lat * Math.PI / 180;
        for (let i = 0; i <= 48; i++) { const lo = i / 48 * Math.PI * 2; p.push([Math.cos(la) * Math.cos(lo), Math.sin(la), Math.cos(la) * Math.sin(lo)]); }
        garis(p);
      }
      for (let lo = 0; lo < 180; lo += 30) {
        const p = [], l = lo * Math.PI / 180;
        for (let i = 0; i <= 48; i++) { const la = i / 48 * Math.PI * 2; p.push([Math.cos(la) * Math.cos(l), Math.sin(la), Math.cos(la) * Math.sin(l)]); }
        garis(p);
      }

      // petir dari elektroda tengah ke permukaan; yang di belakang lebih redup
      c.globalCompositeOperation = "lighter";
      ujung.forEach((u, i) => {
        let v = u.map(x => x + (Math.random() - .5) * .08);
        if (jari) v = v.map((x, k) => x + (jari[k] - x) * (i < 3 ? .35 : .04));
        ujung[i] = v = norm(v);
        const [ex, ey, ez] = proyeksi(v), dalam = (ez + 1) / 2;
        const pts = jalurKilat(C, C, ex, ey, R * .45, 6);
        gambarKilat(c, pts, i % 3 ? "#b07bff" : "#ff7be0", 2 + dalam * 3, .35 + dalam * .65);
        c.fillStyle = `rgba(255,220,255,${.3 + dalam * .5})`; c.beginPath(); c.arc(ex, ey, 3 + dalam * 4, 0, Math.PI * 2); c.fill();
      });
      c.globalCompositeOperation = "source-over";

      // elektroda tengah
      const e = c.createRadialGradient(C, C, 0, C, C, R * .16);
      e.addColorStop(0, "#fff"); e.addColorStop(.4, "#e2b8ff"); e.addColorStop(1, "rgba(176,123,255,0)");
      c.fillStyle = e; c.beginPath(); c.arc(C, C, R * .16, 0, Math.PI * 2); c.fill();
      // kilau kaca
      c.fillStyle = "rgba(255,255,255,.12)"; c.beginPath(); c.ellipse(C - R * .38, C - R * .45, R * .22, R * .1, -.6, 0, Math.PI * 2); c.fill();
      c.strokeStyle = "rgba(200,180,255,.5)"; c.lineWidth = 3; c.beginPath(); c.arc(C, C, R, 0, Math.PI * 2); c.stroke();
      requestAnimationFrame(frame);
    })();
  }
