<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Pacifico&display=swap" rel="stylesheet">
<script>window.AUTH_HALAMAN_LOGIN = true;</script>
<script src="auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Montserrat", system-ui, sans-serif; color: #fbf1f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: linear-gradient(180deg, #170b1f 0%, #2e1233 30%, #5a2042 58%, #96384f 82%, #d4675a 100%) fixed; overflow-x: hidden; }
  body::before { content: ""; position: fixed; left: 50%; bottom: -30vh; width: 120vw; height: 70vh; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,214,150,.5) 0%, rgba(255,140,110,.2) 35%, transparent 70%); }
  .bokeh { position: fixed; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,226,180,.9), rgba(255,170,140,0) 70%);
    animation: tw var(--t) ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .15 } to { opacity: .8 } }
  .card { position: relative; width: min(100%, 420px); text-align: center; padding: 36px 26px 30px; border-radius: 26px;
    background: rgba(30,14,36,.6); border: 1px solid rgba(255,200,220,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(20,5,20,.45); animation: up .8s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { opacity: 0; transform: translateY(30px) } }
  .lock { font-size: 3rem; animation: float 2.6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px) } }
  h1 { font-family: "Pacifico", cursive; font-weight: 400; color: #ff7aa8; font-size: clamp(1.8rem, 7vw, 2.4rem); margin-top: 6px; }
  p { color: #d4b8c8; line-height: 1.6; margin-top: 8px; font-size: .95rem; }
  #gbtn { display: flex; justify-content: center; margin-top: 24px; min-height: 44px; }
  .msg { margin-top: 16px; font-size: .9rem; min-height: 1.4em; }
  .err { color: #ffb3c6; }
  .setup { margin-top: 18px; text-align: left; font-size: .85rem; background: rgba(0,0,0,.25); border-radius: 14px; padding: 14px; color: #ffe3ea; line-height: 1.6; }
  .lokal { margin-top: 14px; padding: 11px 20px; border-radius: 999px; border: 1px dashed rgba(255,255,255,.35); background: none; color: #fff; font: 600 .9rem "Montserrat", sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <main class="card">
    <div class="lock">🔐</div>
    <h1>Halo!</h1>
    <p>Halaman ini khusus. Masuk dulu pakai akun Google kamu ya.</p>
    <div id="gbtn"></div>
    <div class="msg" id="msg"></div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  // hanya boleh kembali ke halaman di situs ini sendiri
  const next = (params.get("next") || "index.html").replace(/^[\/\\]+/, "");
  const tujuan = /^[\w.-]+\.html(\?[\w=&%.-]*)?$/.test(next) ? next : "index.html";

  for (let i = 0; i < 24; i++) {
    const b = document.createElement("span"), s = 4 + Math.random() * 14;
    b.className = "bokeh";
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;top:${20 + Math.random() * 80}%;--t:${2 + Math.random() * 4}s`;
    document.body.prepend(b);
  }

  if (authUser()) location.replace(tujuan);

  // isi token Google (JWT) -> ambil email, nama, foto
  function bacaToken(jwt) {
    const b64 = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(atob(b64).split("").map(c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join("")));
  }

  function masuk(resp) {
    const d = bacaToken(resp.credential);
    if (!d.email_verified || !authBoleh(d.email)) {
      $("msg").innerHTML = `<span class="err">Maaf, akun <b>${d.email.replace(/[<>&]/g, "")}</b> tidak punya akses 🙏</span>`;
      google.accounts.id.disableAutoSelect();
      return;
    }
    authSimpan({ email: d.email, nama: d.given_name || d.name, foto: d.picture });
    $("msg").textContent = `Selamat datang, ${d.given_name || d.name} ✨`;
    setTimeout(() => location.replace(tujuan), 700);
  }

  function pasangTombol() {
    if (!AUTH.clientId) {
      $("gbtn").remove();
      $("msg").outerHTML = `<div class="setup">⚙️ <b>Login Google belum diatur.</b><br>Isi <code>clientId</code> dan <code>emailBoleh</code> di file <code>auth.js</code>.</div>`;
      // hanya untuk mencoba di laptop sendiri
      if (["localhost", "127.0.0.1"].includes(location.hostname)) {
        const b = document.createElement("button");
        b.className = "lokal"; b.textContent = "Masuk mode lokal (khusus laptop)";
        b.onclick = () => { authSimpan({ email: AUTH.emailBoleh[0], nama: "Mode lokal" }); location.replace(tujuan); };
        document.querySelector(".card").appendChild(b);
      }
      return;
    }
    google.accounts.id.initialize({ client_id: AUTH.clientId, callback: masuk, auto_select: false });
    google.accounts.id.renderButton($("gbtn"), { theme: "filled_black", size: "large", shape: "pill", text: "signin_with", locale: "id" });
  }

  // tunggu library Google selesai dimuat
  (function tunggu(n) {
    if (!AUTH.clientId || (window.google && google.accounts && google.accounts.id)) return pasangTombol();
    if (n > 100) { $("msg").innerHTML = '<span class="err">Gagal memuat login Google. Cek koneksi internet lalu muat ulang.</span>'; return; }
    setTimeout(() => tunggu(n + 1), 100);
  })(0);
</script>
</body>
</html>
